[package]
name = "ptt2me"
version = "1.0.5"
edition = "2021"
description = "Minimal offline GigaAM v3 push-to-talk for macOS"

[dependencies]
block2 = "0.5"
cpal = "0.15"
core-foundation = "0.10"
core-graphics = "0.24"
libc = "0.2"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
  "NSArray", "NSData", "NSString", "NSURL", "NSUserDefaults", "NSTimer", "NSRunLoop", "NSThread",
] }
objc2-app-kit = { version = "0.2", features = [
  "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
  "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSImage",
  "NSButton", "NSButtonCell", "NSControl", "NSResponder", "NSView", "NSCell",
  "NSColor", "NSRunningApplication",
] }
rtrb = "0.3.4"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-oslog = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []

[[test]]
name = "pasteboard_main"
path = "tests/pasteboard_main.rs"
harness = false
required-features = ["test-support"]

[profile.release]
opt-level = 3
lto = true
strip = true
