[package]
name = "ptt2me"
default-run = "ptt2me"
version = "1.2.1"
edition = "2021"
description = "Minimal offline GigaAM v3 push-to-talk for macOS"

[dependencies]
base64 = "0.23"
block2 = "0.5"
cpal = "0.15"
core-foundation = "0.10"
core-graphics = "0.24"
ed25519-dalek = "2"
libc = "0.2"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
  "NSArray", "NSData", "NSString", "NSURL", "NSUserDefaults", "NSTimer", "NSRunLoop", "NSThread", "NSProcessInfo",
] }
objc2-app-kit = { version = "0.2", features = [
  "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
  "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSImage",
  "NSButton", "NSButtonCell", "NSControl", "NSResponder", "NSView", "NSCell",
  "NSColor", "NSRunningApplication",
] }
rtrb = "0.3.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-oslog = "0.3"
ureq = "2.12"

[dev-dependencies]
tempfile = "3"

[features]
test-support = []

[[test]]
name = "pasteboard_main"
path = "tests/pasteboard_main.rs"
harness = false
required-features = ["test-support"]

[[example]]
name = "insertion_bridge"
path = "tests/gui/insertion_bridge.rs"
crate-type = ["staticlib"]
required-features = ["test-support"]

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "asr-test-worker"
path = "tests/support/asr_test_worker.rs"
required-features = ["test-support"]

[[test]]
name = "asr_process"
path = "tests/asr_process.rs"
required-features = ["test-support"]
