name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, test, lint, and audit
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare repository toolchain
        run: bash scripts/cloud-setup.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all tests
        run: cargo test --all-targets --features test-support -- --test-threads=1

      - name: Deny Clippy warnings
        run: cargo clippy --all-targets --features test-support -- -D warnings

      - name: Audit dependencies
        run: cargo audit --no-fetch --deny warnings
