version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Disable routine version PRs; repository security updates remain enabled.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Disable routine version PRs; repository security updates remain enabled.
    open-pull-requests-limit: 0
